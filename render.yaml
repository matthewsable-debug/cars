# Render Blueprint — deploy with one click from the Render dashboard
# (New → Blueprint → point at this repo). Gives you a public https URL.
#
# Runs the DOCKER image (Dockerfile), which is based on the official Playwright
# image and bundles Chromium — so the headless-browser scraper works (Render's
# native Node runtime does NOT include a browser). Chromium needs real memory,
# so a Standard instance (2 GB) is used, not the 512 MB Starter.
#
# Durability across redeploys comes from the managed Postgres database below:
# the app mirrors every change to it and restores on each deploy.
databases:
  - name: car-monitor-db
    plan: basic-256mb

services:
  - type: web
    name: car-dealer-monitor
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Durable storage — survives redeploys. Wired automatically from the DB above.
      - key: DATABASE_URL
        fromDatabase:
          name: car-monitor-db
          property: connectionString
      - key: MAIL_TZ
        value: America/New_York
      - key: MAIL_HOUR
        value: "7"
      - key: SCAN_INTERVAL_MS
        value: "1800000"
      # Secrets — set these in the Render dashboard (sync:false keeps them out of git).
      - key: MAIL_TO
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
